<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AssetGuard Pro - Car Tracking System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
* { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
body { margin: 0; height: 100vh; background: radial-gradient(circle at center, #2c5364, #0f2027); display: flex; justify-content: center; align-items: center; overflow: hidden; }
#notification { position: fixed; top: 20px; background: #333; color: #fff; padding: 12px 25px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; box-shadow: 0 5px 15px rgba(0,0,0,0.3); display: none; z-index: 5000; animation: slideDown 0.4s ease-out; }
@keyframes slideDown { from { top: -50px; opacity: 0; } to { top: 20px; opacity: 1; } }

.scene { width: 360px; height: 640px; perspective: 1200px; }
.card { width: 100%; height: 100%; position: relative; }
.face { position: absolute; inset: 0; background: #fff; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; justify-content: flex-start; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
h2 { margin-bottom: 4px; color: #2c5364; font-weight: 800; font-size: 1.25rem; }
input { width: 100%; padding: 11px 12px; margin: 6px 0; border-radius: 10px; border: 1px solid #ddd; outline: none; background: #f9fbff; font-size: 13px; }
button.action-btn { width: 100%; padding: 12px; margin-top: 10px; background: #2c5364; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.95rem; }
button.action-btn:disabled { background: #94a3b8; cursor: not-allowed; }

.terms-container { display: flex; align-items: center; background: #f1f5f9; padding: 10px 12px; border-radius: 10px; margin: 6px 0; border: 1px solid #cbd5e1; cursor: pointer; }
.terms-container input { width: auto; margin: 0 10px 0 0; accent-color: #2c5364; height: 16px; width: 16px; cursor: pointer; }
.terms-container label { font-size: 0.8rem; font-weight: 700; color: #334155; cursor: pointer; }
</style>
</head>
<body>

<div id="notification"></div>

<div class="scene">
  <div class="card" id="card">
    
    <!-- Sign In Face -->
    <div class="face login">
      <h2>AssetGuard Pro</h2>
      <p style="font-size:0.8rem; color:#64748b; margin-top:0; margin-bottom:12px;">Car Tracking Portal Access</p>

      <input id="l_email" type="email" placeholder="Email Address">
      <input id="l_pin" type="password" placeholder="Password / PIN">

      <div class="terms-container" onclick="document.getElementById('l_acceptTerms').click()">
        <input type="checkbox" id="l_acceptTerms" onclick="event.stopPropagation()">
        <label for="l_acceptTerms"> Accept Terms & Conditions</label>
      </div>

      <div class="terms-container" onclick="document.getElementById('l_acceptGps').click()">
        <input type="checkbox" id="l_acceptGps" onclick="event.stopPropagation()">
        <label for="l_acceptGps"> Accept & Turn On GPS</label>
      </div>

      <div class="terms-container" onclick="document.getElementById('l_rememberMe').click()">
        <input type="checkbox" id="l_rememberMe" onclick="event.stopPropagation()">
        <label for="l_rememberMe"> Remember Me & Auto Sign-In</label>
      </div>

      <button class="action-btn" id="loginBtn" onclick="doLogin()">Sign In</button>
    </div>

  </div>
</div>

<script>
const DASHBOARD_URL = "4.html"; 

const firebaseConfig = {
  apiKey: "AIzaSyDCkP7LTzdNcvZhp24rRsQirYDCcrsuvOA",
  authDomain: "assetguard-c8c8c.firebaseapp.com",
  projectId: "assetguard-c8c8c",
  databaseURL: "https://assetguard-c8c8c-default-rtdb.firebaseio.com"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const auth = firebase.auth();
const rtdb = firebase.database();

function msg(text, color="#ef4444") {
  const el = document.getElementById("notification");
  el.innerText = text; el.style.backgroundColor = color; el.style.display = "block";
  setTimeout(() => { el.style.display = "none"; }, 4000);
}

// --- Auto-Login Check on Page Load ---
window.addEventListener('DOMContentLoaded', () => {
  const rememberMe = localStorage.getItem("ag_remember_me") === "true";
  if (rememberMe) {
    msg("Finding your car...", "#3b82f6");
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        await finalizeLoginProcess(user, user.email, true);
      }
    });
  }
});

async function finalizeLoginProcess(user, email, isAutoLogin = false) {
  const role = "car_tracking_system";

  if (!("geolocation" in navigator)) {
    if (!isAutoLogin) msg("Geolocation is not supported by your browser.");
    return;
  }

  let lat = null, lng = null, accuracy = null, gpsTimestamp = null;
  try {
    const position = await new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 });
    });
    lat = position.coords.latitude;
    lng = position.coords.longitude;
    accuracy = position.coords.accuracy;
    gpsTimestamp = Date.now();

    localStorage.setItem("ag_last_lat", lat);
    localStorage.setItem("ag_last_lng", lng);
  } catch (gpsErr) {
    console.error("GPS Error:", gpsErr);
    if (!isAutoLogin) {
      let errMsg = "Mandatory GPS location is required to sign in. Please enable device location.";
      if (gpsErr.code === gpsErr.PERMISSION_DENIED) {
        errMsg = "Location permission denied in browser settings.";
      } else if (gpsErr.code === gpsErr.TIMEOUT) {
        errMsg = "GPS request timed out.";
      }
      return msg(errMsg);
    } else {
      // Fallback for auto-login if GPS is temporarily blocked/unavailable after reboot
      lat = parseFloat(localStorage.getItem("ag_last_lat")) || -0.3031;
      lng = parseFloat(localStorage.getItem("ag_last_lng")) || 36.0800;
      accuracy = 50;
      gpsTimestamp = Date.now();
    }
  }

  // Store session details
  localStorage.setItem("ag_active_uid", user.uid);
  localStorage.setItem("ag_session_active", "true");
  localStorage.setItem("ag_user_role", role);
  localStorage.setItem("ag_user_email", email);

  const currentDate = new Date().toISOString().split('T')[0];
  const dispatchId = "RS-" + Date.now().toString().slice(-8);
  const dispatchPayload = {
    id: dispatchId,
    uid: user.uid,
    agents: [{ name: email.split('@')[0], role: "Operator" }],
    date: currentDate,
    createdAt: Date.now(),
    timeString: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
    vehicle: "N/A",
    phone: "+254713100424",
    notes: isAutoLogin ? "Auto-Login GPS Tracking" : "Portal Login GPS Tracking",
    status: "Pending",
    lastLocation: { lat, lng, accuracy, timestamp: gpsTimestamp }
  };

  await rtdb.ref(`dispatches/${dispatchId}`).set(dispatchPayload);
  localStorage.setItem("ag_active_dispatch_id", dispatchId);

  const updatePayload = {
    role: role,
    lastLogin: Date.now(),
    lastLocation: { lat, lng, accuracy, timestamp: gpsTimestamp }
  };

  await rtdb.ref(`users/${user.uid}`).update(updatePayload);
  await rtdb.ref(`user_statuses/${user.uid}`).set("Active");

  await rtdb.ref(`user_activity_logs`).push({
    uid: user.uid,
    category: "SECURITY",
    action: isAutoLogin ? "Auto-Login with GPS" : "Car Tracking System Login with GPS",
    description: `User logged in. GPS: ${lat.toFixed(5)}, ${lng.toFixed(5)}`,
    timestamp: Date.now(),
    device: navigator.userAgent
  });

  window.location.href = DASHBOARD_URL;
}

async function doLogin() {
  const email = document.getElementById("l_email").value.trim().toLowerCase();
  const pass = document.getElementById("l_pin").value.trim();
  const acceptTerms = document.getElementById("l_acceptTerms").checked;
  const acceptGps = document.getElementById("l_acceptGps").checked;
  const rememberMe = document.getElementById("l_rememberMe").checked;

  if (!email || !pass) return msg("Please enter your email and password.");
  if (!acceptTerms) return msg("You must accept the terms and conditions to sign in.");
  if (!acceptGps) return msg("You must accept and turn on GPS to sign in.");

  const btn = document.getElementById("loginBtn");
  btn.disabled = true; 
  btn.innerText = "Authenticating...";

  try {
    localStorage.setItem("ag_remember_me", rememberMe ? "true" : "false");

    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    const userCredential = await auth.signInWithEmailAndPassword(email, pass);
    
    btn.innerText = "Finding your car...";
    await finalizeLoginProcess(userCredential.user, email, false);

  } catch (err) {
    console.error("Login Error:", err);
    msg("Login failed: " + err.message);
    btn.disabled = false; 
    btn.innerText = "Sign In";
  }
}
</script>
</body>
</html>
