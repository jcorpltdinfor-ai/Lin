<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AssetGuard Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }

body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at center, #2c5364, #0f2027);
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
  padding-top: 50px;
}

.hero-content h1 {
  margin: 0;
  font-size: 2.5rem;
  color: white;
  text-shadow: 0 4px 15px rgba(0,0,0,0.4);
  text-align: center;
}

.top-nav {
  width: 90%;
  max-width: 280px;
  background: linear-gradient(145deg, #1e3a46, #2c5364);
  border-radius: 50px;
  padding: 6px 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 20px 0;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

.hero-content p {
  margin: 0;
  font-size: 0.9rem;
  color: rgba(255,255,255,0.4);
  letter-spacing: 3px;
  text-transform: uppercase;
  text-align: center;
}

.logo {
  color: #fff;
  font-weight: 800;
  font-size: 0.75rem;
}

.menu-btn {
  background: #fff;
  color: #2c5364;
  border: none;
  padding: 4px 10px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 0.65rem;
  font-weight: 700;
}

.auth-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 3000;
  backdrop-filter: blur(8px);
}

.scene {
  width: 340px;
  height: 530px;
  perspective: 1200px;
}

.card {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.8s;
}

.card.flip-register {
  transform: rotateY(180deg);
}

.face {
  position: absolute;
  inset: 0;
  background: #fff;
  border-radius: 20px;
  padding: 30px;
  backface-visibility: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.register {
  transform: rotateY(180deg);
}

h2 {
  margin-bottom: 20px;
  color: #2c5364;
}

input {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 10px;
  border: 1px solid #ddd;
}

button.action-btn {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  background: #2c5364;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

.link {
  text-align: center;
  margin-top: 12px;
  font-size: 0.85rem;
  color: #2c5364;
  cursor: pointer;
  font-weight: 600;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 4000;
}

.modal-content {
  background: #fff;
  padding: 30px;
  border-radius: 15px;
  width: 300px;
  text-align: center;
}
</style>
</head>

<body>

<div class="hero-content">
  <h1>AssetGuard Pro</h1>
  <nav class="top-nav">
    <div class="logo">PORTAL</div>
    <button class="menu-btn" onclick="toggleAuth()">LOGIN</button>
  </nav>
  <p>Secure Inventory System</p>
</div>

<!-- AUTH OVERLAY -->
<div class="auth-overlay" id="authOverlay" onclick="closeIfOutside(event)">
  <div class="scene" onclick="event.stopPropagation()">
    <div class="card" id="card">

      <!-- LOGIN -->
      <div class="face login">
        <h2>Sign In</h2>
        <input id="l_email" type="email" placeholder="Email">
        <input id="l_pin" type="password" placeholder="Password / PIN">
        <button class="action-btn" onclick="doLogin()">Login</button>
        <div class="link" onclick="showForgotModal()">Forgot?</div>
        <div class="link" onclick="goRegister()">Create Account</div>
      </div>

      <!-- REGISTER -->
      <div class="face register">
        <h2>Join Us</h2>
        <input id="r_user" placeholder="Username">
        <input id="r_email" type="email" placeholder="Email">
        <input id="r_pass" type="password" placeholder="Password">
        <input id="r_pass_confirm" type="password" placeholder="Confirm Password">
        <button class="action-btn" onclick="doSignup()">Register</button>
        <div class="link" onclick="goLogin()">Back</div>
      </div>

    </div>
  </div>
</div>

<!-- RESET MODAL -->
<div class="modal" id="forgotModal">
  <div class="modal-content">
    <h2>Reset Access</h2>
    <input id="f_email" placeholder="Email">
    <button class="action-btn" onclick="doReset()">Send</button>
    <div class="link" style="color:red" onclick="closeForgotModal()">Cancel</div>
  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDCkP7LTzdNcvZhp24rRsQirYDCcrsuvOA",
  authDomain: "assetguard-c8c8c.firebaseapp.com",
  databaseURL: "https://assetguard-c8c8c-default-rtdb.firebaseio.com",
  projectId: "assetguard-c8c8c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const DASHBOARD_URL = "dashboard.html";

/* UI ELEMENTS */
const authOverlay = document.getElementById("authOverlay");
const card = document.getElementById("card");
const modal = document.getElementById("forgotModal");

/* UI NAVIGATION */
window.toggleAuth = () =>
  authOverlay.style.display =
    authOverlay.style.display === "flex" ? "none" : "flex";

window.closeIfOutside = e => {
  if (e.target === authOverlay) toggleAuth();
};

window.goRegister = () => card.className = "card flip-register";
window.goLogin = () => card.className = "card";

window.showForgotModal = () => modal.style.display = "flex";
window.closeForgotModal = () => modal.style.display = "none";

/* LOGIN FUNCTION (Online + Offline) */
window.doLogin = async () => {

  const email = document.getElementById("l_email").value.trim();
  const pin = document.getElementById("l_pin").value.trim();

  if (!email || !pin) {
    alert("Enter Email and Password/PIN.");
    return;
  }

  /* ✅ ONLINE LOGIN */
  if (navigator.onLine) {

    signInWithEmailAndPassword(auth, email, pin)
      .then(userCred => {

        const uid = userCred.user.uid;

        /* SAVE ACCOUNT FOR OFFLINE USE */
        if (window.AppInventor) {
          window.AppInventor.setWebViewString(
            "SAVE|" + email + "|" + uid + "|" + pin
          );
        }

        alert("Login Success (Online)");
        setTimeout(() => window.location.href = DASHBOARD_URL, 500);

      })
      .catch(err => alert("Login Failed: " + err.message));

  }

  /* ✅ OFFLINE LOGIN */
  else {

    alert("Offline Mode: Checking saved account...");

    if (window.AppInventor) {
      window.AppInventor.setWebViewString(
        "VERIFY|" + email + "|" + pin
      );
    }
  }
};

/* SIGNUP */
window.doSignup = () => {

  const user = document.getElementById("r_user").value.trim();
  const email = document.getElementById("r_email").value.trim();
  const pass = document.getElementById("r_pass").value.trim();
  const confirm = document.getElementById("r_pass_confirm").value.trim();

  if (pass !== confirm) {
    alert("Passwords do not match!");
    return;
  }

  createUserWithEmailAndPassword(auth, email, pass)
    .then(res => {

      set(ref(db, "users/" + res.user.uid), {
        username: user,
        email: email
      });

      alert("Account Created. Please Login.");
      goLogin();

    })
    .catch(err => alert(err.message));
};

/* RESET PASSWORD */
window.doReset = () => {

  const email = document.getElementById("f_email").value.trim();

  sendPasswordResetEmail(auth, email)
    .then(() => {
      alert("Reset link sent!");
      closeForgotModal();
    })
    .catch(err => alert(err.message));
};

/* ✅ RECEIVE RESPONSE FROM KODULAR */
if (window.AppInventor) {

  window.AppInventor.getWebViewString = function(msg) {

    console.log("Kodular Response:", msg);

    if (msg === "OFFLINE_OK") {
      alert("Offline Login Success!");
      window.location.href = DASHBOARD_URL;
    }

    if (msg === "OFFLINE_FAIL") {
      alert("Offline Login Failed. No saved account found.");
    }

  };
}

</script>

</body>
</html>
