<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AssetGuard Pro - Car Tracking System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
* { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
body { margin: 0; height: 100vh; background: radial-gradient(circle at center, #2c5364, #0f2027); display: flex; flex-direction: column; align-items: center; overflow: hidden; padding-top: 50px; }
#notification { position: fixed; top: 20px; background: #333; color: #fff; padding: 12px 25px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; box-shadow: 0 5px 15px rgba(0,0,0,0.3); display: none; z-index: 5000; animation: slideDown 0.4s ease-out; }
@keyframes slideDown { from { top: -50px; opacity: 0; } to { top: 20px; opacity: 1; } }
.hero-content h1 { margin: 0; font-size: 2.5rem; color: white; text-align: center; }
.top-nav { width: 90%; max-width: 280px; background: linear-gradient(145deg, #1e3a46, #2c5364); border-radius: 50px; padding: 6px 15px; display: flex; justify-content: space-between; align-items: center; margin: 20px 0; }
.logo { color: #fff; font-weight: 800; font-size: 0.70rem; letter-spacing: 0.05em; }
.menu-btn { background: #fff; color: #2c5364; border: none; padding: 6px 15px; border-radius: 20px; cursor: pointer; font-size: 0.75rem; font-weight: 700; }
.auth-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 3000; backdrop-filter: blur(8px); }
.scene { width: 360px; height: 640px; perspective: 1200px; }
.card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.8s; }
.face { position: absolute; inset: 0; background: #fff; border-radius: 20px; padding: 22px; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: flex-start; overflow-y: auto; }
h2 { margin-bottom: 4px; color: #2c5364; font-weight: 800; font-size: 1.25rem; }
input { width: 100%; padding: 11px 12px; margin: 6px 0; border-radius: 10px; border: 1px solid #ddd; outline: none; background: #f9fbff; font-size: 13px; }
button.action-btn { width: 100%; padding: 12px; margin-top: 10px; background: #2c5364; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.95rem; }
button.action-btn.google-btn { background: #fff; color: #334155; border: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; }
button.action-btn:disabled { background: #94a3b8; cursor: not-allowed; }
.link { text-align: center; margin-top: 10px; font-size: 0.8rem; color: #2c5364; cursor: pointer; font-weight: 600; }
.loading-screen { position: fixed; inset: 0; background: #0f2027; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 6000; font-family: 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 20px; }
.spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid #fff; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Auto-Start Loading Screen -->
<div class="loading-screen" id="loadingScreen">
  <div class="spinner"></div>
  <h2 id="loadingText" style="color:white; font-size: 1.2rem; margin:0;">Initializing App Instance...</h2>
  <p id="loadingSubText" style="font-size: 0.85rem; color:#94a3b8; margin-top:8px;">Acquiring secure GPS & session...</p>
</div>

<div id="notification"></div>

<div class="hero-content">
  <h1>AssetGuard Pro</h1>
  <nav class="top-nav">
    <div class="logo">CAR TRACKING SYSTEM</div>
    <button class="menu-btn" onclick="toggleAuth()">SETTINGS</button>
  </nav>
</div>

<!-- Instance Binding Modal (Triggers only if no email is assigned to this app copy yet) -->
<div class="auth-overlay" id="authOverlay">
  <div class="scene">
    <div class="card">
      <div class="face">
        <h2>App Instance Setup</h2>
        <p style="font-size:0.8rem; color:#64748b; margin-top:0; margin-bottom:12px;">Bind a dedicated Gmail/Email to this specific app download.</p>

        <input id="instance_email" type="email" placeholder="Assigned Email (e.g. car01@gmail.com)">
        
        <button class="action-btn google-btn" onclick="bindGoogleAccount()">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27H6.58H1.19C.43 8.11 0 9.82 0 11.6s.43 3.49 1.19 5.02l4.09-2.35z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.68 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
          Bind with Google Sign-In
        </button>
      </div>
    </div>
  </div>
</div>

<script>
// =====================================================================
// INSTANCE CONFIGURATION PER DOWNLOAD
// You can hardcode an email here for this specific file download, OR 
// leave it empty ("") to have it prompt you once on the very first start.
// =====================================================================
const PRESET_ASSIGNED_EMAIL = ""; 

const DASHBOARD_URL = "4.html"; 

const firebaseConfig = {
  apiKey: "AIzaSyDCkP7LTzdNcvZhp24rRsQirYDCcrsuvOA",
  authDomain: "assetguard-c8c8c.firebaseapp.com",
  projectId: "assetguard-c8c8c",
  databaseURL: "https://assetguard-c8c8c-default-rtdb.firebaseio.com"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const auth = firebase.auth();
const rtdb = firebase.database();

function msg(text, color="#ef4444") {
  const el = document.getElementById("notification");
  el.innerText = text; el.style.backgroundColor = color; el.style.display = "block";
  setTimeout(() => { el.style.display = "none"; }, 4000);
}

// Automatically execute startup sequence on page load
window.addEventListener("DOMContentLoaded", async () => {
  let assignedEmail = PRESET_ASSIGNED_EMAIL || localStorage.getItem("ag_instance_assigned_email");

  if (!assignedEmail) {
    // First time opening this specific app download: Show setup screen
    document.getElementById("loadingScreen").style.display = "none";
    document.getElementById("authOverlay").style.display = "flex";
    return;
  }

  // App is already bound to an email, run auto-start sequence
  await runAutoStart(assignedEmail);
});

// Bind email to this app instance via Google Sign-In popup (done only once per app download)
async function bindGoogleAccount() {
  const provider = new firebase.auth.GoogleAuthProvider();
  try {
    const result = await auth.signInWithPopup(provider);
    const user = result.user;
    
    // Save email association to this specific app installation storage
    localStorage.setItem("ag_instance_assigned_email", user.email);
    document.getElementById("authOverlay").style.display = "none";
    document.getElementById("loadingScreen").style.display = "flex";
    
    await runAutoStart(user.email);
  } catch (err) {
    console.error("Binding Error:", err);
    msg("Binding failed: " + err.message);
  }
}

// Seamless background auto-start sequence
async function runAutoStart(email) {
  const loadingText = document.getElementById("loadingText");
  const loadingSubText = document.getElementById("loadingSubText");

  loadingText.innerText = `Starting up as ${email}...`;
  loadingSubText.innerText = "Acquiring live GPS location...";

  let lat = null, lng = null, accuracy = null, gpsTimestamp = null;

  if ("geolocation" in navigator) {
    try {
      const position = await new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 });
      });
      lat = position.coords.latitude;
      lng = position.coords.longitude;
      accuracy = position.coords.accuracy;
      gpsTimestamp = Date.now();

      localStorage.setItem("ag_last_lat", lat);
      localStorage.setItem("ag_last_lng", lng);
    } catch (gpsErr) {
      console.warn("GPS timeout/denied, proceeding with cached location:", gpsErr);
      lat = parseFloat(localStorage.getItem("ag_last_lat")) || 0;
      lng = parseFloat(localStorage.getItem("ag_last_lng")) || 0;
    }
  }

  const user = auth.currentUser;
  if (!user) {
    // If Firebase session expired, try anonymous or prompt re-auth if needed
    loadingSubText.innerText = "Restoring session...";
    try {
      await auth.signInAnonymously();
    } catch(e) { console.error(e); }
  }

  const activeUid = user ? user.uid : (localStorage.getItem("ag_active_uid") || "instance_user");
  const role = "car_tracking_system";

  localStorage.setItem("ag_active_uid", activeUid);
  localStorage.setItem("ag_session_active", "true");
  localStorage.setItem("ag_user_role", role);
  localStorage.setItem("ag_user_email", email);

  // Log dispatch & location update to Firebase database
  const currentDate = new Date().toISOString().split('T')[0];
  const dispatchId = "RS-" + Date.now().toString().slice(-8);
  const dispatchPayload = {
    id: dispatchId,
    uid: activeUid,
    agents: [{ name: email.split('@')[0], role: "Operator" }],
    date: currentDate,
    createdAt: Date.now(),
    timeString: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
    vehicle: "Assigned Unit",
    phone: "+254713100424",
    notes: `Auto-Start Instance Login for ${email}`,
    status: "Pending",
    lastLocation: { lat, lng, accuracy, timestamp: gpsTimestamp }
  };

  try {
    await rtdb.ref(`dispatches/${dispatchId}`).set(dispatchPayload);
    localStorage.setItem("ag_active_dispatch_id", dispatchId);

    await rtdb.ref(`users/${activeUid}`).update({
      email: email,
      role: role,
      lastLogin: Date.now(),
      lastLocation: { lat, lng, accuracy, timestamp: gpsTimestamp }
    });
    await rtdb.ref(`user_statuses/${activeUid}`).set("Active");
  } catch (e) {
    console.error("Firebase sync error during auto-start:", e);
  }

  // Redirect instantly to the dashboard
  loadingText.innerText = "Redirecting to Dashboard...";
  setTimeout(() => {
    window.location.href = DASHBOARD_URL;
  }, 600);
}

function toggleAuth() {
  const o = document.getElementById("authOverlay");
  o.style.display = (o.style.display === "flex") ? "none" : "flex";
}
</script>
</body>
</html>
